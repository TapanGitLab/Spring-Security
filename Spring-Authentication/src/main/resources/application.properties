spring.application.name=Spring-Authentication
server.port=8081

# In-memory H2 database — resets every restart, zero setup required
spring.datasource.url=jdbc:h2:mem:authenticationdemo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console (permitAll in SecurityConfig)
spring.h2.console.enabled=true
